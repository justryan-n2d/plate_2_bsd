name: Validate Plate 2 Drawing Data

on:
  push:
    branches: [main]
    paths:
      - "site/phase1_traverse_coordinates.csv"
      - "scripts/**"
      - ".github/workflows/validate-drawings.yml"
  pull_request:
    paths:
      - "site/phase1_traverse_coordinates.csv"
      - "scripts/**"
      - ".github/workflows/validate-drawings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site-base:
    name: Validate Phase 1 traverse
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drawing dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate adjusted traverse
        run: python scripts/validate_site_base.py
