name: Validate Plate 2 CAD and Phase 2 Site Calculations

on:
  push:
    branches: [main]
    paths:
      - "site/phase1_traverse_coordinates.csv"
      - "site/phase2_setback_inputs.csv"
      - "site/phase2_code_requirements.csv"
      - "calculations/phase2_site_calculations.md"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/validate-drawings.yml"
  pull_request:
    paths:
      - "site/phase1_traverse_coordinates.csv"
      - "site/phase2_setback_inputs.csv"
      - "calculations/phase2_site_calculations.md"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/validate-drawings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-site-cad:
    name: Validate Phase 1 CAD and Phase 2 site calculations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check Python scripts
        run: python -m compileall -q scripts tests

      - name: Install drawing dependency
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate source traverse
        run: python scripts/validate_site_base.py

      - name: Run Phase 2 unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify committed Phase 2 report is current
        run: python scripts/calculate_phase2_site.py --check-report calculations/phase2_site_calculations.md

      - name: Generate DXF and SVG
        run: python scripts/generate_site_base.py

      - name: Validate generated DXF and SVG against source
        run: python scripts/validate_generated_dxf.py

      - name: Upload validated CAD drawing and SVG preview
        uses: actions/upload-artifact@v4
        with:
          name: plate2-phase1-cad-${{ github.run_number }}
          path: |
            drawings/phase1_site_base.dxf
            previews/phase1_site_base_preview.svg
          if-no-files-found: error
          retention-days: 14
