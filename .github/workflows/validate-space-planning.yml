name: Validate Phase 3 Space Planning

on:
  push:
    branches: [main]
    paths:
      - "space_planning/**"
      - "scripts/validate_space_planning.py"
      - ".github/workflows/validate-space-planning.yml"
  pull_request:
    paths:
      - "space_planning/**"
      - "scripts/validate_space_planning.py"
      - ".github/workflows/validate-space-planning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-space-planning:
    name: Check Phase 3 schedules and SVG diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check validator
        run: python -m py_compile scripts/validate_space_planning.py
      - name: Validate schedule, adjacency and diagrams
        run: python scripts/validate_space_planning.py
