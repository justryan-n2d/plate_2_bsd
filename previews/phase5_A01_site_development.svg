<title id="title">A-01 Preliminary site development plan</title>
<desc id="desc">Preliminary site-development drawing using the adjusted Lot 245-B local traverse and a uniform 2.00 metre inward screening offset. The front/east facade is provisionally on the entry and carport side. A dashed 3.00 by 1.50 metre second-floor balcony projection is shown beside the family-area portion of the east/front wall. The house placement is shifted north for the selected academic envelope; the elevated projection is not extra ground-floor coverage and needs final carport/canopy coordination. This is not an approved or code-compliant site plan; exact road right-of-way, access, zoning and final setbacks remain pending.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:27px;font-weight:700;fill:#172033}.sub{font-size:14px;fill:#64748b}.head{font-size:16px;font-weight:700;fill:#172033}.note{font-size:13px;fill:#475569}.small{font-size:12px;fill:#475569}</style>
