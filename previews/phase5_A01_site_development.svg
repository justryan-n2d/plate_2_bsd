<text class="head" x="875" y="190">SITE AND AREA NOTES</text>
<text class="note" x="875" y="222">Adjusted traverse area: 265.26 m²</text>
<text class="note" x="875" y="246">Assignment approximate area: 300.00 m²</text>
<text class="note" x="875" y="270">Difference: 34.74 m² lower than approximate value</text>
<line x1="875" y1="292" x2="1330" y2="292" stroke="#e2e8f0"/>
<text class="head" x="875" y="322">SCHEMATIC AREA BUDGET</text>
<text class="note" x="875" y="350">House footprint: 9.30 x 7.90 = 73.47 m²</text>
<text class="note" x="875" y="375">Covered carport: 2.80 x 5.50 = 15.40 m²</text>
<text class="note" x="875" y="400">Combined covered area: 88.87 m²</text>
<text class="note" x="875" y="425">Indicative combined cover: 33.5% of 265.26 m²</text>
<text class="note" x="875" y="450">Arithmetic unbuilt remainder: 176.39 m²</text>
<text class="small" x="875" y="475">The remainder is not a final code-defined open-space result.</text>
<line x1="875" y1="498" x2="1330" y2="498" stroke="#e2e8f0"/>
<text class="head" x="875" y="529">DESIGN HOLD POINTS</text>
<text class="note" x="875" y="557">1. Confirm the approved survey plan and road / ROW limits.</text>
<text class="note" x="875" y="583">2. Confirm Palo zoning classification and applicable setbacks.</text>
<text class="note" x="875" y="609">3. Confirm front / side / rear yard assignments for both road edges.</text>
<text class="note" x="875" y="635">4. Confirm driveway, gate, vehicle maneuvering and pedestrian path.</text>
<text class="note" x="875" y="661">5. Verify required open space, lot occupancy and parking rules.</text>
<text class="note" x="875" y="687">6. Check drainage, actual site levels and parcel-specific hazards.</text>
<line x1="875" y1="711" x2="1330" y2="711" stroke="#e2e8f0"/>
<text class="head" x="875" y="742">BOUNDARY / ROAD NOTE</text>
<text class="note" x="875" y="770">The given 5.0 m road width and 8.00 m ROW are separate values.</text>
<text class="note" x="875" y="796">The illustrated line is a uniform 2.00 m inward offset from the</text>
<text class="note" x="875" y="822">current academic plot, not a confirmed legal building envelope.</text>
<text class="note" x="875" y="848">The building / carport placement is a study only and may change.</text>
<text class="sub" x="35" y="965">Source geometry: site/phase1_traverse_coordinates.csv. Reference: PD 1096 Section 708(a), subject to verification. Drawing scale is schematic.</text>
