<title id="title">A-02 - Reference Layout Ground Floor Plan</title>
<desc id="desc">Preliminary furnished ground-floor layout revised from the user's reference image. It includes a guest room, toilet and bath, garage, dining area, kitchen, storage, stairway, living room and entrance foyer. The TV console is placed inside the living-room area away from the entrance path. Diagrammatic layout only, not dimensioned for construction and not approved for code compliance.</desc>
