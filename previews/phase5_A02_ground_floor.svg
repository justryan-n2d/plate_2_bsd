<title id="title">A-02 - Ground Floor plan</title>
<desc id="desc">Preliminary ground floor plan concept with required room labels and target clear dimensions, not to scale for construction and not approved for code compliance. The front/east facade is provisionally the right-hand entry side, matching the carport on A-01. The second-floor balcony is external and is not part of this ground-floor enclosed area. Bedroom / guest room: 3.00 x 3.00 m | Toilet and bath: 1.50 x 2.10 m | Stairway: 2.00 x 3.20 m envelope | Storage / service area: 1.50 x 2.00 m | Entrance / foyer: 1.50 x 1.50 m | Living room: 3.60 x 3.80 m | Dining area: 2.80 x 2.80 m | Kitchen: 2.50 x 2.80 m</desc>
