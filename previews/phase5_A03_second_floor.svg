<title id="title">A-03 - Second Floor plan with required balcony</title>
<desc id="desc">Preliminary second floor plan concept with required room labels, target clear dimensions, and a required 3.00 x 1.50 m balcony (4.50 m2) on the east/front (right) facade, accessed from the family area. Not to scale for construction and not approved for code compliance. Master bedroom: 3.20 x 3.40 m | Stair opening / flight: 2.00 x 3.20 m; stairwell zone | Bedroom 3: 2.80 x 3.00 m | Toilet and bath: 1.50 x 2.10 m, rotated | Stair landing / circulation: 2.00 x 2.50 m | Bedroom 2: 2.80 x 3.00 m | Shared hall / circulation: additional schematic hall; verify in final layout | Family area: 2.80 x 3.00 m | Balcony: 3.00 x 1.50 m, 4.50 m2</desc>
