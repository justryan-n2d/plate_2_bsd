<title id="title">A-03 - Reference Layout Second Floor Plan</title>
<desc id="desc">Preliminary furnished second-floor layout revised from the user's reference image. It includes Bedroom 2, master bedroom and robe, Bedroom 3, bathroom, toilet, toilet and bath, gym, karaoke room, stairway, family area and balcony. The karaoke room has exactly one door, shown on its west wall to the circulation hall. Diagrammatic only, not dimensioned for construction and not approved for code compliance.</desc>
