<title id="title">A-04 Preliminary roof plan</title>
<desc id="desc">Preliminary 9.30 by 7.90 metre gable roof plan with assumed 20 degree pitch, ridge along the building depth, eaves and slope arrows. The required east/front balcony beside the family area is shown as a dashed projection beyond the east edge. Not a roof-framing or construction drawing.</desc>
