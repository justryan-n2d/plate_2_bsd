<title id="title">A-06 Preliminary building sections</title>
<desc id="desc">Two preliminary sections, including a stair vertical-development study, show the assumed ground floor, second floor, eave and roof-ridge levels. The drawing is preliminary and not a final coordinated building section; it must be checked with the final structure and code requirements.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:26px;font-weight:700;fill:#172033}.sub{font-size:14px;fill:#64748b}.head{font-size:16px;font-weight:700;fill:#172033}.note{font-size:12px;fill:#475569}</style>
<rect width="1400" height="930" fill="#f8fafc"/>
<text class="title" x="35" y="40">A-06 | BUILDING SECTIONS (PRELIMINARY)</text>
<text class="sub" x="35" y="67">Section A-A through stair development; Section B-B through general room massing. Not construction details.</text>
