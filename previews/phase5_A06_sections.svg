<text class="note" x="735" y="670">Assumed floor levels: 3.000 m floor-to-floor. Roof and story heights remain provisional.</text>
<text class="note" x="735" y="694">Verify floor/ceiling clear heights, wall openings, slab and beam depths.</text>
<text class="note" x="735" y="718">No structural member sizing or footing reinforcement is included.</text>
<text class="note" x="735" y="742">BP 344 applicability and accessible-route requirements remain unresolved.</text>
<rect x="60" y="770" width="580" height="55" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="75" y="793" font-size="12" font-weight="700" fill="#9a3412">Schematic section - not yet a coordinated architectural section</text>
<text x="75" y="813" font-size="11" fill="#9a3412">Confirm final levels and headroom after beam/soffit layout.</text>
<text class="sub" x="35" y="900">Required submission A-06 calls for at least two sections, including one through the actual stair. These drafts need final coordination.</text>
