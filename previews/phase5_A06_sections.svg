<text class="note" x="60" y="514">8 physical treads per flight @ 280 mm; 2.240 m run per flight.</text>
<text class="note" x="60" y="538">Verify minimum 2.000 m clear headroom under actual beams/slabs.</text>
<text class="note" x="60" y="562">Final cut line and landing/stair opening must match A-02 / A-03.</text>
