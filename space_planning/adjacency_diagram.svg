<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title description">
<title id="title">Plate No. 2 Phase 3 - Revised adjacency and relationship diagram</title>
<desc id="description">Phase 3 Revision 04 preliminary adjacency diagram for the selected reference, not to scale and not a dimensioned or code-approved floor plan. Ground-floor spaces: Entrance / foyer; Living room; Dining area; Kitchen; Toilet and bath (ground floor); Bedroom / guest room; Stairway; Storage / service area; Garage / carport; General circulation allowance. Second-floor spaces: Master bedroom; Robe / wardrobe (master bedroom); Bedroom 2; Bedroom 3; one combined Toilet and bath (second floor); Family area; Stair landing / circulation; Karaoke room; Gym; Balcony (if appropriate). The separate upstairs Bathroom and Toilet are removed. Solid green lines show direct preferred relationships, dashed slate lines show nearby relationships, dotted amber lines show buffered privacy relationships, and dashed amber lines show conditional relationships. The TV console remains within the living room, clear of the foyer and entrance route. The karaoke room is entered from shared circulation through one door only; the gym has independent shared-hall access. Area-budget targets are planning values, not measured dimensions; estimated gross proxies are about 86.26 m² ground floor and 77.66 m² second floor. The 4.95 m² released area has not been reallocated. Local zoning/ROW and final floor areas remain pending.</desc>
