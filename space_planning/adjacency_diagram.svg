<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title description">
  <title id="title">Plate No. 2 Phase 3 - Adjacency and relationship diagram</title>
  <desc id="description">Preliminary adjacency diagram, not to scale and not a code-approved floor plan. Required spaces shown: Entrance / foyer; Living room; Dining area; Kitchen; Toilet and bath (ground floor); Bedroom / guest room; Stairway; Storage / service area; Garage / carport; General circulation allowance; Master bedroom; Bedroom 2; Bedroom 3; Toilet and bath (second floor); Family area; Stair landing / circulation; Balcony. Solid green lines mean direct preferred adjacency. Dashed slate lines mean nearby spaces. Dotted amber lines mean a buffer or conditional relationship.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .page-title{font-size:30px;font-weight:700}
    .sub{font-size:15px;fill:#526176}
    .panel-title{font-size:18px;font-weight:700}
    .node-label{font-size:13px;font-weight:600}
    .note{font-size:13px;fill:#526176}
    .legend{font-size:14px;font-weight:600}
  </style>
  <rect width="1500" height="1000" fill="#f8fafc"/>
  <text class="page-title" x="42" y="50">SPACE ADJACENCY / RELATIONSHIP DIAGRAM</text>
  <text class="sub" x="42" y="82">Concept-stage relationship study for the required spaces on both floors</text>
  <rect x="35" y="115" width="700" height="765" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
  <rect x="765" y="115" width="700" height="765" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
  <text class="panel-title" x="60" y="152">GROUND FLOOR</text>
  <text class="sub" x="60" y="176">Public / social, service and guest spaces</text>
  <text class="panel-title" x="790" y="152">SECOND FLOOR</text>
  <text class="sub" x="790" y="176">Family circulation and private bedroom zone</text>

  <!-- Ground-floor relationship lines, behind the space nodes -->
  <line x1="220" y1="285" x2="250" y2="285" stroke="#2d6a5d" stroke-width="4"/>
  <line x1="390" y1="285" x2="430" y2="285" stroke="#2d6a5d" stroke-width="4"/>
  <line x1="500" y1="320" x2="500" y2="390" stroke="#2d6a5d" stroke-width="4"/>
  <line x1="500" y1="460" x2="500" y2="540" stroke="#2d6a5d" stroke-width="4"/>
  <line x1="150" y1="320" x2="150" y2="390" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="320" y1="320" x2="320" y2="390" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="220" y1="425" x2="250" y2="425" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="220" y1="575" x2="250" y2="575" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="320" y1="460" x2="320" y2="540" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <g><rect x="80" y="250" width="140" height="70" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="150" y="275" text-anchor="middle"><tspan x="150" dy="0">Entrance / foyer</tspan><tspan x="150" dy="20">1.50 x 1.50 m</tspan></text></g>
  <g><rect x="250" y="250" width="140" height="70" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="320" y="275" text-anchor="middle"><tspan x="320" dy="0">Living room</tspan><tspan x="320" dy="20">3.60 x 3.80 m</tspan></text></g>
  <g><rect x="430" y="250" width="140" height="70" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="500" y="275" text-anchor="middle"><tspan x="500" dy="0">Dining area</tspan><tspan x="500" dy="20">2.80 x 2.80 m</tspan></text></g>
  <g><rect x="80" y="390" width="140" height="70" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="150" y="415" text-anchor="middle"><tspan x="150" dy="0">Garage / carport</tspan><tspan x="150" dy="20">Covered-open</tspan></text></g>
  <g><rect x="250" y="390" width="140" height="70" rx="12" fill="#eeeafa" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="320" y="415" text-anchor="middle"><tspan x="320" dy="0">Stairway</tspan><tspan x="320" dy="20">Footprint target</tspan></text></g>
  <g><rect x="430" y="390" width="140" height="70" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="500" y="415" text-anchor="middle"><tspan x="500" dy="0">Kitchen</tspan><tspan x="500" dy="20">2.50 x 2.80 m</tspan></text></g>
  <g><rect x="80" y="540" width="140" height="70" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="150" y="565" text-anchor="middle"><tspan x="150" dy="0">Toilet and bath</tspan><tspan x="150" dy="20">Ground floor</tspan></text></g>
  <g><rect x="250" y="540" width="140" height="70" rx="12" fill="#fff3dc" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="320" y="565" text-anchor="middle"><tspan x="320" dy="0">Bedroom / guest</tspan><tspan x="320" dy="20">room</tspan></text></g>
  <g><rect x="430" y="540" width="140" height="70" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="500" y="565" text-anchor="middle"><tspan x="500" dy="0">Storage / service</tspan><tspan x="500" dy="20">area</tspan></text></g>
  <rect x="80" y="665" width="490" height="84" rx="12" fill="#f8fafc" stroke="#d7dee8"/>
  <text class="node-label" x="100" y="693">General circulation allowance: 4.50 m²</text>
  <text class="note" x="100" y="718">Reserve clear routes; this is an area allowance, not a room.</text>
  <text class="note" x="80" y="795">The road-side approach and exact driveway position are not selected.</text>

  <!-- Second-floor relationship lines -->
  <line x1="950" y1="285" x2="990" y2="285" stroke="#2d6a5d" stroke-width="4"/>
  <line x1="1130" y1="285" x2="1170" y2="285" stroke="#b77935" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line x1="1060" y1="320" x2="875" y2="470" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="1060" y1="320" x2="1240" y2="470" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="950" y1="505" x2="990" y2="505" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="1130" y1="505" x2="1170" y2="505" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="1240" y1="320" x2="1240" y2="350" stroke="#2d6a5d" stroke-width="4"/>
  <g><rect x="800" y="250" width="150" height="70" rx="12" fill="#eeeafa" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="875" y="275" text-anchor="middle"><tspan x="875" dy="0">Stair landing /</tspan><tspan x="875" dy="20">circulation</tspan></text></g>
  <g><rect x="990" y="250" width="140" height="70" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="1060" y="275" text-anchor="middle"><tspan x="1060" dy="0">Family area</tspan><tspan x="1060" dy="20">2.80 x 3.00 m</tspan></text></g>
  <g><rect x="1170" y="250" width="140" height="70" rx="12" fill="#fff3dc" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="1240" y="275" text-anchor="middle"><tspan x="1240" dy="0">Master bedroom</tspan><tspan x="1240" dy="20">3.20 x 3.40 m</tspan></text></g>
  <g><rect x="800" y="470" width="150" height="70" rx="12" fill="#fff3dc" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="875" y="495" text-anchor="middle"><tspan x="875" dy="0">Bedroom 2</tspan><tspan x="875" dy="20">2.80 x 3.00 m</tspan></text></g>
  <g><rect x="990" y="470" width="140" height="70" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="1060" y="495" text-anchor="middle"><tspan x="1060" dy="0">Toilet and bath</tspan><tspan x="1060" dy="20">Second floor</tspan></text></g>
  <g><rect x="1170" y="470" width="140" height="70" rx="12" fill="#fff3dc" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="1240" y="495" text-anchor="middle"><tspan x="1240" dy="0">Bedroom 3</tspan><tspan x="1240" dy="20">2.80 x 3.00 m</tspan></text></g>
  <g><rect x="1170" y="350" width="140" height="70" rx="12" fill="#d1fae5" stroke="#0f766e" stroke-width="1.8"/><text class="node-label" x="1240" y="375" text-anchor="middle"><tspan x="1240" dy="0">Required balcony</tspan><tspan x="1240" dy="20">3.00 x 1.50 m</tspan></text></g>
  <text class="note" x="800" y="770">Keep bedrooms independently accessible from shared circulation.</text>
  <text class="note" x="800" y="793">The required balcony connects directly to the master bedroom; its 4.50 m² is tracked separately from enclosed floor area.</text>

  <!-- Relationship legend -->
  <rect x="42" y="905" width="1416" height="68" rx="14" fill="#ffffff" stroke="#d7dee8"/>
  <line x1="70" y1="938" x2="120" y2="938" stroke="#2d6a5d" stroke-width="4"/><text class="legend" x="132" y="943">Direct preferred</text>
  <line x1="340" y1="938" x2="390" y2="938" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/><text class="legend" x="402" y="943">Keep nearby</text>
  <line x1="595" y1="938" x2="645" y2="938" stroke="#b77935" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><text class="legend" x="657" y="943">Keep privacy buffer</text>
  <line x1="900" y1="938" x2="950" y2="938" stroke="#b77935" stroke-width="3" stroke-dasharray="6 6"/><text class="legend" x="962" y="943">Conditional / optional</text>
  <text class="note" x="1188" y="943">Not to scale</text>
</svg>