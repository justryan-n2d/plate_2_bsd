<title id="title">Plate No. 2 Phase 3 - Revised ground-floor zoning</title>
<desc id="description">Conceptual ground-floor zoning following the user reference, not to scale and not a dimensioned plan. The required spaces are Entrance / foyer; Living room; Dining area; Kitchen; Toilet and bath (ground floor); Bedroom / guest room; Stairway; Storage / service area; Garage / carport; General circulation allowance. The TV console is located in the living room and outside the foyer and entry-clearance path. The guest room is at upper left, bathroom below it, garage at lower left, dining at upper right, kitchen below dining, storage and stairway to the right of circulation, and living room/foyer at the lower right/centre. Room dimensions are not determined by this diagram.</desc>
<defs><pattern id="floorgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e7e4dc" stroke-width=".8"/></pattern><marker id="entryArrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#28715f"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1e293b}.title{font-size:28px;font-weight:800}.sub{font-size:14px;fill:#64748b}.room{font-size:15px;font-weight:750;text-anchor:middle;letter-spacing:.4px}.labelSmall{font-size:12px;fill:#526176;text-anchor:middle}.noteTitle{font-size:18px;font-weight:800}.note{font-size:14px;fill:#475569}.wall{fill:none;stroke:#273138;stroke-width:9;stroke-linejoin:miter}.inner{fill:none;stroke:#3b454b;stroke-width:5}</style>
<rect width="1320" height="930" fill="#f8fafc"/><text x="40" y="48" class="title">PHASE 3  |  GROUND-FLOOR ZONING</text><text x="40" y="76" class="sub">Spatial arrangement follows reference layout revision 01. Blocks describe relationships only, not construction geometry.</text>
