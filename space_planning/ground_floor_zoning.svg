<path d="M410 805V733L448 733" stroke="#28715f" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#entryArrow)"/><text x="415" y="828" class="labelSmall">ENTRY APPROACH</text></g>
<g><rect x="940" y="130" width="340" height="330" rx="14" fill="#fff" stroke="#d7dee8"/><text x="965" y="167" class="noteTitle">LAYOUT PRIORITIES</text><text x="965" y="205" class="note"><tspan x="965">• TV stays within the living room.</tspan><tspan x="965" dy="24">• Keep the entry/foyer route clear.</tspan><tspan x="965" dy="24">• Dining connects directly to kitchen.</tspan><tspan x="965" dy="24">• Storage sits beside the stair zone.</tspan><tspan x="965" dy="24">• Guest room and bath stay nearby.</tspan><tspan x="965" dy="24">• Do not pass through a bedroom to</tspan><tspan x="980" dy="20">reach another room.</tspan></text>
<rect x="940" y="485" width="340" height="255" rx="14" fill="#fffaf1" stroke="#ead6b6"/><text x="965" y="524" class="noteTitle">PHASE 3 HOLD POINTS</text><text x="965" y="562" class="note"><tspan x="965">• Diagram is not to scale.</tspan><tspan x="965" dy="24">• Old room-size targets are inherited</tspan><tspan x="980" dy="20">and not verified against this layout.</tspan><tspan x="965" dy="24">• Confirm garage vs carport.</tspan><tspan x="965" dy="24">• Measure final walls, clearances,</tspan><tspan x="980" dy="20">doors, windows and circulation.</tspan></text></g>
<text x="40" y="895" class="sub">Concept only. The reference images do not establish room dimensions, area totals, setbacks or construction details.</text></svg>