<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Plate No. 2 Phase 3 - Ground-floor conceptual zoning</title>
  <desc id="description">Conceptual ground-floor zoning diagram, not to scale and not a dimensioned plan. Required spaces: Entrance / foyer; Living room; Dining area; Kitchen; Toilet and bath (ground floor); Bedroom / guest room; Stairway; Storage / service area; Garage / carport; General circulation allowance. The carport-to-entry relationship is conceptual and does not select a driveway or gate.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:29px;font-weight:700}
    .sub{font-size:15px;fill:#526176}
    .zone-title{font-size:14px;font-weight:700}
    .zone-size{font-size:12px;fill:#526176}
    .note{font-size:13px;fill:#526176}
    .key{font-size:13px;font-weight:600}
  </style>
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text class="title" x="40" y="48">GROUND FLOOR - CONCEPTUAL ZONING</text>
  <text class="sub" x="40" y="78">Functional groupings only. Blocks are not to scale and do not define walls or openings.</text>
  <rect x="250" y="160" width="730" height="515" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text class="sub" x="270" y="185">Schematic enclosed building zone (final footprint pending Phase 2)</text>

  <g><rect x="270" y="210" width="195" height="120" rx="12" fill="#fff3dc" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="367.5" y="260" text-anchor="middle"><tspan x="367.5" dy="0">Bedroom / guest room</tspan><tspan x="367.5" dy="20">3.00 x 3.00 m</tspan></text></g>
  <g><rect x="475" y="210" width="145" height="120" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="547.5" y="260" text-anchor="middle"><tspan x="547.5" dy="0">Toilet and bath</tspan><tspan x="547.5" dy="20">Ground floor</tspan></text></g>
  <g><rect x="630" y="210" width="160" height="120" rx="12" fill="#eeeafa" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="710" y="260" text-anchor="middle"><tspan x="710" dy="0">Stairway</tspan><tspan x="710" dy="20">2.00 x 2.80 m target</tspan></text></g>
  <g><rect x="800" y="210" width="155" height="120" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="877.5" y="260" text-anchor="middle"><tspan x="877.5" dy="0">Storage / service</tspan><tspan x="877.5" dy="20">1.50 x 2.00 m</tspan></text></g>
  <g><rect x="270" y="345" width="240" height="125" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="390" y="397.5" text-anchor="middle"><tspan x="390" dy="0">Living room</tspan><tspan x="390" dy="20">3.60 x 3.80 m</tspan></text></g>
  <g><rect x="520" y="345" width="175" height="125" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="607.5" y="397.5" text-anchor="middle"><tspan x="607.5" dy="0">Dining area</tspan><tspan x="607.5" dy="20">2.80 x 2.80 m</tspan></text></g>
  <g><rect x="705" y="345" width="250" height="125" rx="12" fill="#e4f4eb" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="830" y="397.5" text-anchor="middle"><tspan x="830" dy="0">Kitchen</tspan><tspan x="830" dy="20">2.50 x 2.80 m</tspan></text></g>
  <g><rect x="270" y="485" width="165" height="135" rx="12" fill="#e8f1f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="352.5" y="542.5" text-anchor="middle"><tspan x="352.5" dy="0">Entrance / foyer</tspan><tspan x="352.5" dy="20">1.50 x 1.50 m</tspan></text></g>
  <g><rect x="445" y="485" width="190" height="135" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="540" y="542.5" text-anchor="middle"><tspan x="540" dy="0">General circulation</tspan><tspan x="540" dy="20">4.50 m² allowance</tspan></text></g>
  <g><rect x="645" y="485" width="310" height="135" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text class="node-label" x="800" y="542.5" text-anchor="middle"><tspan x="800" dy="0">Shared routes / clearances</tspan><tspan x="800" dy="20">Final widths and paths pending</tspan></text></g>
  <g><rect x="45" y="355" width="170" height="145" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/><text class="node-label" x="130" y="407.5" text-anchor="middle"><tspan x="130" dy="0">Garage / carport</tspan><tspan x="130" dy="20">2.80 x 5.50 m</tspan><tspan x="130" dy="20">Covered-open</tspan></text></g>
  <line x1="215" y1="425" x2="270" y2="550" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
  <text class="note" x="45" y="525">One-car placeholder only.</text>
  <text class="note" x="45" y="545">Driveway / gate not set.</text>

  <rect x="40" y="715" width="1120" height="125" rx="14" fill="#ffffff" stroke="#d7dee8"/>
  <text class="zone-title" x="65" y="747">Planning notes</text>
  <text class="note" x="65" y="775">- Keep living and dining connected; connect dining directly to the kitchen.</text>
  <text class="note" x="65" y="799">- Keep the guest room private from the living zone and the bathroom nearby.</text>
  <text class="note" x="65" y="823">- Road frontage is described on the southeast and southwest sides, but the final approach is not selected.</text>
</svg>