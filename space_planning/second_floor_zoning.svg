<g><rect x="940" y="130" width="340" height="330" rx="14" fill="#fff" stroke="#d7dee8"/><text x="965" y="167" class="noteTitle">LAYOUT PRIORITIES</text><text x="965" y="205" class="note"><tspan x="965">• Bedrooms open to shared hall.</tspan><tspan x="965" dy="24">• Keep one combined upstairs toilet and bath</tspan><tspan x="980" dy="20">only; no separate Bathroom / Toilet.</tspan><tspan x="965" dy="24">• Karaoke has one door only.</tspan><tspan x="965" dy="24">• Gym has independent hall access. The door is not through a bedroom.</tspan><tspan x="965" dy="24">• Family area connects to the landing.</tspan></text>
<rect x="940" y="485" width="340" height="255" rx="14" fill="#fffaf1" stroke="#ead6b6"/><text x="965" y="524" class="noteTitle">PHASE 3 HOLD POINTS</text><text x="965" y="562" class="note"><tspan x="965">• Diagram is not to scale.</tspan><tspan x="965" dy="24">• Old room-size targets are inherited</tspan><tspan x="980" dy="20">and not verified against this layout.</tspan><tspan x="965" dy="24">• Balcony depends on setback, privacy,</tspan><tspan x="980" dy="20">guardrail, access and structure review.</tspan><tspan x="965" dy="24">• Confirm stair opening and landing.</tspan></text></g>
<text x="40" y="895" class="sub">Concept only. Target sizes are not measured. Lower zone: gym left, family area right, stair upper-right, direct family-area door to the bottom-edge balcony. Budget proxy: 66.01 m² clear / 77.66 m² gross.</text></svg>