<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="930" viewBox="0 0 1320 930" role="img" aria-labelledby="title description">
<title id="title">Plate No. 2 Phase 3 - Revised second-floor zoning</title>
<desc id="description">Conceptual second-floor zoning for Phase 3 Revision 04, not to scale and not a dimensioned plan. Required spaces are Master bedroom; Bedroom 2; Bedroom 3; one combined Toilet and bath (second floor); Family area; Stair landing / circulation. Additional spaces are Robe / wardrobe (master bedroom), Karaoke room and Gym. Balcony (if appropriate) is conditional. The separate upstairs Bathroom and Toilet have been removed by user decision. The 4.95 m² area released by their provisional targets remains unallocated pending dimensioned layout. The karaoke room has exactly one marked access door from shared circulation. Size callouts are planning targets, not measured dimensions.</desc>
<defs><pattern id="floorgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e7e4dc" stroke-width=".8"/></pattern></defs>
