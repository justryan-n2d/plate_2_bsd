<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Phase 4 U-shaped stair plan study</title>
<desc id="desc">Preliminary stair plan, not to scale for construction. Two flights with 900 millimetre clear width each, nine risers per flight, eight 280 millimetre treads per flight, intermediate landing 900 millimetres deep and nominal 2.00 by 3.20 metre space envelope. Floor-to-floor rise is assumed 3.00 metres.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.title{font-size:25px;font-weight:700}
.sub{font-size:14px;fill:#526176}
.label{font-size:13px;font-weight:600}
.small{font-size:12px;fill:#526176}
.dim{stroke:#475569;stroke-width:1.4;fill:none}
.step{stroke:#64748b;stroke-width:1.5}
</style>
<rect width="1000" height="650" fill="#f8fafc"/>
<text class="title" x="36" y="42">PHASE 4 - U-SHAPED STAIR PLAN STUDY</text>
<text class="sub" x="36" y="68">Nominal planning envelope: 2.00 m x 3.20 m. Not a construction drawing.</text>

<!-- envelope at 100 px/m -->
<rect x="250" y="112" width="200" height="320" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
<rect x="250" y="112" width="200" height="90" fill="#eeeafa" stroke="#8977bd" stroke-width="1.5"/>
<text class="label" x="350" y="145" text-anchor="middle">HALF-LANDING</text>
<text class="small" x="350" y="165" text-anchor="middle">2.00 m nominal wide</text>
<text class="small" x="350" y="182" text-anchor="middle">0.90 m deep</text>

<!-- flight 1 on left bay -->
<rect x="250" y="202" width="90" height="224" fill="#deecfa" stroke="#6b91b8" stroke-width="1.4"/>
<line class="step" x1="250" y1="230" x2="340" y2="230"/>
<line class="step" x1="250" y1="258" x2="340" y2="258"/>
<line class="step" x1="250" y1="286" x2="340" y2="286"/>
<line class="step" x1="250" y1="314" x2="340" y2="314"/>
<line class="step" x1="250" y1="342" x2="340" y2="342"/>
<line class="step" x1="250" y1="370" x2="340" y2="370"/>
<line class="step" x1="250" y1="398" x2="340" y2="398"/>
<line class="step" x1="250" y1="426" x2="340" y2="426"/>
<text class="label" x="295" y="294" text-anchor="middle">FLIGHT 1</text>
<text class="small" x="295" y="312" text-anchor="middle">UP</text>
<path d="M295 380 L295 330 M288 338 L295 330 L302 338" stroke="#285f8f" stroke-width="3" fill="none"/>

<!-- flight 2 on right bay -->
<rect x="360" y="202" width="90" height="224" fill="#dff3e8" stroke="#438568" stroke-width="1.4"/>
<line class="step" x1="360" y1="230" x2="450" y2="230"/>
<line class="step" x1="360" y1="258" x2="450" y2="258"/>
<line class="step" x1="360" y1="286" x2="450" y2="286"/>
<line class="step" x1="360" y1="314" x2="450" y2="314"/>
<line class="step" x1="360" y1="342" x2="450" y2="342"/>
<line class="step" x1="360" y1="370" x2="450" y2="370"/>
<line class="step" x1="360" y1="398" x2="450" y2="398"/>
<line class="step" x1="360" y1="426" x2="450" y2="426"/>
<text class="label" x="405" y="294" text-anchor="middle">FLIGHT 2</text>
<text class="small" x="405" y="312" text-anchor="middle">UP / RETURN</text>
<path d="M405 330 L405 380 M398 372 L405 380 L412 372" stroke="#2d6a5d" stroke-width="3" fill="none"/>

<text class="small" x="250" y="454">Ground-floor start</text>
<text class="small" x="450" y="454" text-anchor="end">Second-floor arrival</text>

<!-- dimensions -->
<line class="dim" x1="250" y1="490" x2="450" y2="490"/>
<line class="dim" x1="250" y1="480" x2="250" y2="500"/>
<line class="dim" x1="450" y1="480" x2="450" y2="500"/>
<path d="M258 486 L250 490 L258 494 M442 486 L450 490 L442 494" class="dim"/>
<text class="label" x="350" y="483" text-anchor="middle">2.00 m nominal width</text>

<line class="dim" x1="490" y1="112" x2="490" y2="432"/>
<line class="dim" x1="480" y1="112" x2="500" y2="112"/>
<line class="dim" x1="480" y1="432" x2="500" y2="432"/>
<path d="M486 120 L490 112 L494 120 M486 424 L490 432 L494 424" class="dim"/>
<text class="label" x="510" y="276">3.20 m</text>
<text class="small" x="510" y="294">nominal length</text>

<rect x="570" y="112" width="390" height="335" rx="12" fill="#ffffff" stroke="#d7dee8"/>
<text class="label" x="594" y="144">DESIGN DATA</text>
<text class="small" x="594" y="176">• Assumed floor-to-floor rise: 3.000 m</text>
<text class="small" x="594" y="202">• 18 risers total, 9 per flight</text>
<text class="small" x="594" y="228">• 8 physical treads per flight</text>
<text class="small" x="594" y="254">• Riser: 166.7 mm</text>
<text class="small" x="594" y="280">• Tread: 280 mm</text>
<text class="small" x="594" y="306">• Clear width: 900 mm each flight</text>
<text class="small" x="594" y="332">• Half-landing: 900 mm deep</text>
<text class="small" x="594" y="358">• 8 x 280 = 2.240 m run / flight</text>
<text class="small" x="594" y="384">• 2.240 + 0.900 = 3.140 m required length</text>
<text class="small" x="594" y="410">• 60 mm nominal length allowance</text>
<text class="small" x="594" y="436">Confirm handrails, walls, doors and actual clear widths.</text>

<rect x="36" y="525" width="924" height="76" rx="10" fill="#fff7e6" stroke="#d8b46b"/>
<text class="label" x="56" y="553">Important</text>
<text class="small" x="56" y="576">BP 344 accessibility applicability is not resolved. If accessible-stair rules apply, width/landing/riser/tread and route provisions require a larger redesign.</text>
<text class="small" x="36" y="630">All dimensions are preliminary planning targets; check the accepted floor levels and final code path before the plans are frozen.</text>
</svg>
