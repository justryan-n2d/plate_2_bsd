<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Phase 4 stair vertical development / section study</title>
<desc id="desc">Unfolded stair development schematic, not to scale for construction. Assumed total rise 3.00 metres, two flights each rising 1.50 metres with nine risers at 166.7 millimetres and eight 280 millimetre treads, a 900 millimetre landing depth, and minimum 2.00 metre headroom target to be checked in the actual building section.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.title{font-size:25px;font-weight:700}
.sub{font-size:14px;fill:#526176}
.label{font-size:13px;font-weight:600}
.small{font-size:12px;fill:#526176}
.step{stroke:#334155;stroke-width:2.3;fill:none;stroke-linejoin:miter}
.dim{stroke:#64748b;stroke-width:1.4;fill:none}
</style>
<rect width="1100" height="660" fill="#f8fafc"/>
